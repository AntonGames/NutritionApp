[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutrition-app"
version = "0.1.0"
description = "Self-hosted nutrition tracker with GPT Actions, Excel export, and Home Assistant integration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.2",
  "openpyxl>=3.1.5",
  "openai>=1.109.1",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nutrition_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
